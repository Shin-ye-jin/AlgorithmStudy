<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>알고리즘1 vs 알고리즘2 비교</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: sans-serif;
    }

    .box {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      border: 2px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      background: white;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .compare {
      background: #3b82f6;
      color: white;
      border-color: #1d4ed8;
    }

    .found {
      background: #22c55e;
      color: white;
      border-color: #15803d;
      transform: scale(1.08);
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen p-8">

  <div class="max-w-7xl mx-auto">

    <!-- 상단 -->
    <div class="bg-white rounded-3xl shadow-xl p-8 mb-8">
      <h1 class="text-4xl font-bold text-center mb-8">
        알고리즘1 vs 알고리즘2 비교
      </h1>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-6">

        <div>
          <label class="block font-bold mb-2">
            기본 값
          </label>

          <input
            id="normalValue"
            type="number"
            value="10"
            class="w-full border-2 border-slate-300 rounded-xl px-4 py-3"
          />
        </div>

        <div>
          <label class="block font-bold mb-2">
            다른 값
          </label>

          <input
            id="oddValue"
            type="number"
            value="5"
            class="w-full border-2 border-slate-300 rounded-xl px-4 py-3"
          />
        </div>

        <div>
          <label class="block font-bold mb-2">
            다른 값 위치
          </label>

          <input
            id="oddIndex"
            type="number"
            min="1"
            max="10"
            value="7"
            class="w-full border-2 border-slate-300 rounded-xl px-4 py-3"
          />
        </div>

        <div class="flex items-end">
          <button
            onclick="startSimulation()"
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl px-4 py-3"
          >
            시작!
          </button>
        </div>

      </div>
    </div>

    <!-- 메인 -->
    <div id="mainArea" style="display:none;">

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- 알고리즘1 -->
        <div class="bg-white rounded-3xl shadow-xl p-6 border border-orange-200">

          <h2 class="text-3xl font-bold text-orange-600 mb-6">
            알고리즘1
          </h2>

          <div class="bg-slate-50 rounded-2xl p-6 border">

            <h3 id="algo1Title" class="text-2xl font-bold mb-4"></h3>

            <div id="algo1Boxes" class="flex flex-wrap justify-center gap-3 mb-6"></div>

            <div class="text-center space-y-2">
              <div id="algo1Message" class="text-lg font-semibold"></div>
              <div id="algo1Result" class="text-lg font-bold text-orange-600"></div>
            </div>

          </div>

          <div class="flex justify-center gap-4 mt-6">

            <button
              onclick="prevAlgo1()"
              class="px-6 py-3 rounded-xl bg-slate-200 font-bold"
            >
              이전 단계
            </button>

            <button
              onclick="nextAlgo1()"
              class="px-6 py-3 rounded-xl bg-orange-500 text-white font-bold"
            >
              다음 단계
            </button>

          </div>

        </div>

        <!-- 알고리즘2 -->
        <div class="bg-white rounded-3xl shadow-xl p-6 border border-blue-200">

          <h2 class="text-3xl font-bold text-blue-700 mb-6">
            알고리즘2
          </h2>

          <div class="bg-slate-50 rounded-2xl p-6 border">

            <h3 id="algo2Title" class="text-2xl font-bold mb-4"></h3>

            <div
              id="algo2Formula"
              class="bg-slate-900 text-green-400 rounded-2xl p-4 mb-5 font-mono"
            ></div>

            <div id="algo2Boxes" class="flex flex-wrap justify-center gap-3 mb-6"></div>

            <div class="text-center space-y-2">
              <div id="algo2Message" class="text-lg font-semibold"></div>
              <div id="algo2Result" class="text-lg font-bold text-blue-700"></div>
            </div>

          </div>

          <div class="flex justify-center gap-4 mt-6">

            <button
              onclick="prevAlgo2()"
              class="px-6 py-3 rounded-xl bg-slate-200 font-bold"
            >
              이전 단계
            </button>

            <button
              onclick="nextAlgo2()"
              class="px-6 py-3 rounded-xl bg-blue-600 text-white font-bold"
            >
              다음 단계
            </button>

          </div>

        </div>

      </div>

      <!-- 최종 결과 -->
      <div class="mt-10 bg-white rounded-3xl shadow-xl p-8">

        <h2 class="text-3xl font-bold text-center mb-8">
          최종 결과
        </h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

          <div class="bg-orange-50 rounded-2xl p-6 border border-orange-200 text-center">

            <h3 class="text-2xl font-bold text-orange-600 mb-4">
              알고리즘1 결과
            </h3>

            <div id="algo1Final" class="text-4xl font-bold text-orange-700 mb-3"></div>

            <div id="algo1Count" class="text-lg"></div>

          </div>

          <div class="bg-blue-50 rounded-2xl p-6 border border-blue-200 text-center">

            <h3 class="text-2xl font-bold text-blue-700 mb-4">
              알고리즘2 결과
            </h3>

            <div id="algo2Final" class="text-4xl font-bold text-blue-700 mb-3"></div>

            <div id="algo2Count" class="text-lg"></div>

          </div>

        </div>

      </div>

    </div>

  </div>

<script>
let data = [];
let algo1Steps = [];
let algo2Steps = [];

let algo1StepIndex = 0;
let algo2StepIndex = 0;

function startSimulation() {

  const normalValue = Number(document.getElementById('normalValue').value);
  const oddValue = Number(document.getElementById('oddValue').value);
  const oddIndex = Number(document.getElementById('oddIndex').value);

  data = Array(10).fill(normalValue);
  data[oddIndex - 1] = oddValue;

  algo1Steps = [];
  algo2Steps = [];

  // 알고리즘1
  for(let i=0; i<10; i+=2){

    const left = data[i];
    const right = data[i+1];

    if(right === undefined){
      algo1Steps.push({
        title: `${algo1Steps.length+1}단계`,
        compare:[i],
        message:`${i+1}번 확인`,
        result:`${i+1}번 값 발견!`,
        found:i
      });
      break;
    }

    if(left !== right){

      const foundIndex = left < right ? i : i+1;

      algo1Steps.push({
        title:`${algo1Steps.length+1}단계`,
        compare:[i,i+1],
        message:`${i+1}번과 ${i+2}번 비교`,
        result:`${foundIndex+1}번 값 발견! 탐색 종료!`,
        found:foundIndex
      });

      break;
    }

    algo1Steps.push({
      title:`${algo1Steps.length+1}단계`,
      compare:[i,i+1],
      message:`${i+1}번과 ${i+2}번 비교`,
      result:`값 동일 → 다음 탐색`
    });
  }

  // 알고리즘2
  let low = 1;
  let high = 10;

  while(low <= high){

    const middle = Math.floor((low+high)/2);
    const middleIndex = middle - 1;

    const value = data[middleIndex];

    if(value === oddValue){

      algo2Steps.push({
        title:`${algo2Steps.length+1}단계`,
        formula:`low=${low}, high=${high}, middle=(${low}+${high})/2 = ${middle}`,
        compare:[middleIndex],
        message:`${middle}번 값 확인`,
        result:`${middle}번 값 발견! 탐색 종료!`,
        found:middleIndex
      });

      break;
    }

    if(middleIndex < oddIndex-1){

      algo2Steps.push({
        title:`${algo2Steps.length+1}단계`,
        formula:`low=${low}, high=${high}, middle=(${low}+${high})/2 = ${middle}`,
        compare:[middleIndex],
        message:`${middle}번 값 확인`,
        result:`오른쪽 탐색`
      });

      low = middle + 1;

    } else {

      algo2Steps.push({
        title:`${algo2Steps.length+1}단계`,
        formula:`low=${low}, high=${high}, middle=(${low}+${high})/2 = ${middle}`,
        compare:[middleIndex],
        message:`${middle}번 값 확인`,
        result:`왼쪽 탐색`
      });

      high = middle - 1;
    }
  }

  algo1StepIndex = 0;
  algo2StepIndex = 0;

  document.getElementById('mainArea').style.display = 'block';

  renderAlgo1();
  renderAlgo2();

  document.getElementById('algo1Final').innerText = `${oddIndex}번 발견`;
  document.getElementById('algo1Count').innerText = `총 ${algo1Steps.length}번 비교`;

  document.getElementById('algo2Final').innerText = `${oddIndex}번 발견`;
  document.getElementById('algo2Count').innerText = `총 ${algo2Steps.length}번 비교`;
}

function renderBoxes(containerId, step){

  const container = document.getElementById(containerId);
  container.innerHTML = '';

  data.forEach((value,index)=>{

    const box = document.createElement('div');
    box.className = 'box';

    if(step.compare.includes(index)){
      box.classList.add('compare');
    }

    if(step.found === index){
      box.classList.remove('compare');
      box.classList.add('found');
    }

    box.innerHTML = `
      <div style="font-size:12px">${index+1}</div>
      <div style="font-size:20px">${value}</div>
    `;

    container.appendChild(box);
  });
}

function renderAlgo1(){

  const step = algo1Steps[algo1StepIndex];

  document.getElementById('algo1Title').innerText = step.title;
  document.getElementById('algo1Message').innerText = step.message;
  document.getElementById('algo1Result').innerText = step.result;

  renderBoxes('algo1Boxes', step);
}

function renderAlgo2(){

  const step = algo2Steps[algo2StepIndex];

  document.getElementById('algo2Title').innerText = step.title;
  document.getElementById('algo2Formula').innerText = step.formula;
  document.getElementById('algo2Message').innerText = step.message;
  document.getElementById('algo2Result').innerText = step.result;

  renderBoxes('algo2Boxes', step);
}

function nextAlgo1(){
  if(algo1StepIndex < algo1Steps.length - 1){
    algo1StepIndex++;
    renderAlgo1();
  }
}

function prevAlgo1(){
  if(algo1StepIndex > 0){
    algo1StepIndex--;
    renderAlgo1();
  }
}

function nextAlgo2(){
  if(algo2StepIndex < algo2Steps.length - 1){
    algo2StepIndex++;
    renderAlgo2();
  }
}

function prevAlgo2(){
  if(algo2StepIndex > 0){
    algo2StepIndex--;
    renderAlgo2();
  }
}
</script>

</body>
</html>
